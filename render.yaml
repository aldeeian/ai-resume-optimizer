services:
  - type: web
    name: ai-resume-optimizer-ai
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ai-service/Dockerfile
    dockerContext: ai-service
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_SERVICE_API_KEY
        sync: false
